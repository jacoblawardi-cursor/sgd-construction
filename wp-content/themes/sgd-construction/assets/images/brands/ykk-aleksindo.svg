<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- YKK AP & Aleksindo Official Style Logo -->
  <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- YKK Red Badge -->
  <rect x="12" y="16" width="76" height="28" rx="4" fill="#E60012"/>
  <text x="50" y="36" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">YKK AP</text>
  <!-- Divider -->
  <line x1="25" y1="51" x2="75" y2="51" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Aleksindo Aluminium -->
  <g transform="translate(50, 71)">
    <!-- Alexindo Stylized Hex/A symbol -->
    <polygon points="-30,6 -20,-12 -10,6" fill="#0284C7"/>
    <polygon points="-24,4 -20,-4 -16,4" fill="#FFFFFF"/>
    <!-- Alexindo Text -->
    <text x="6" y="2" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">ALEXINDO</text>
  </g>
  <text x="50" y="87" font-family="'Montserrat', sans-serif" font-size="6" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ALUMINIUM SYSTEMS</text>
</svg>
