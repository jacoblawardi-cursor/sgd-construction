<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Cakratunggal Steel (CS) Official Style Emblem -->
  <defs>
    <linearGradient id="csGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <!-- Outer Chakra / Cog Steel Ring -->
  <circle cx="50" cy="42" r="32" fill="none" stroke="url(#csGrad)" stroke-width="4"/>
  <circle cx="50" cy="42" r="26" fill="#0F172A"/>
  <!-- Steel Ribs -->
  <path d="M 50 14 L 50 20 M 50 64 L 50 70 M 22 42 L 28 42 M 72 42 L 78 42 M 30 22 L 35 27 M 65 57 L 70 62 M 30 62 L 35 57 M 65 27 L 70 22" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <!-- CS Monogram -->
  <text x="50" y="49" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CS</text>
  <!-- Brand Label -->
  <text x="50" y="88" font-family="'Montserrat', 'Inter', sans-serif" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1.5">CS STEEL</text>
</svg>