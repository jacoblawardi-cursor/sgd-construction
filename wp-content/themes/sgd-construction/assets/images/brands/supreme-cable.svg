<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Kabel Supreme SUCACO Official Style Logo -->
  <defs>
    <linearGradient id="supRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Supreme Diamond Emblem -->
  <g transform="translate(50, 36)">
    <!-- Red Diamond Shape -->
    <polygon points="0,-22 28,0 0,22 -28,0" fill="url(#supRed)"/>
    <polygon points="0,-18 23,0 0,18 -23,0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Yellow Spark / Conductor Core -->
    <path d="M 3 -12 L -6 1 L 2 1 L -3 12 L 8 -1 L -1 -1 Z" fill="#FACC15"/>
  </g>
  <!-- Supreme Typography -->
  <text x="50" y="73" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#DC2626" text-anchor="middle" letter-spacing="1.2">SUPREME</text>
  <text x="50" y="85" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="2">CABLE</text>
</svg>
