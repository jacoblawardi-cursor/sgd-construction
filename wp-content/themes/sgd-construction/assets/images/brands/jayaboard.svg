<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Jayaboard Gypsum Official Style Logo -->
  <defs>
    <linearGradient id="jayaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F2C59"/>
    </linearGradient>
    <linearGradient id="jayaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Jayaboard Plasterboard / Wave Motif -->
  <g transform="translate(50, 36)">
    <!-- Gypsum Sheet Layers -->
    <path d="M -28 12 L -28 -4 L 28 -14 L 28 2 Z" fill="#E2E8F0"/>
    <path d="M -28 16 L -28 0 L 28 -10 L 28 6 Z" fill="url(#jayaBlue)"/>
    <!-- Red Dynamic Arch / Swoosh -->
    <path d="M -22 -12 C -6 -24, 18 -16, 26 -2 C 22 -4, 4 -12, -14 -4 Z" fill="url(#jayaRed)"/>
  </g>
  <!-- Jayaboard Typography -->
  <text x="50" y="72" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#0F2C59" text-anchor="middle" letter-spacing="1">JAYABOARD</text>
  <text x="50" y="84" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="800" fill="#DC2626" text-anchor="middle" letter-spacing="1.5">GYPSUM CEILING</text>
</svg>
