<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Krakatau Steel 3-Wing Pinwheel Emblem -->
  <g transform="translate(50, 45)">
    <!-- Wing 1 (Top) -->
    <path d="M 0 -38 C 16 -38, 28 -24, 25 -10 C 23 2, 9 6, 0 0 C 5 -13, 0 -26, -15 -30 C -12 -36, -7 -38, 0 -38 Z" fill="#E30613"/>
    <!-- Wing 2 (Bottom Right) -->
    <path d="M 0 -38 C 16 -38, 28 -24, 25 -10 C 23 2, 9 6, 0 0 C 5 -13, 0 -26, -15 -30 C -12 -36, -7 -38, 0 -38 Z" fill="#D30511" transform="rotate(120)"/>
    <!-- Wing 3 (Bottom Left) -->
    <path d="M 0 -38 C 16 -38, 28 -24, 25 -10 C 23 2, 9 6, 0 0 C 5 -13, 0 -26, -15 -30 C -12 -36, -7 -38, 0 -38 Z" fill="#B3000B" transform="rotate(240)"/>
    <!-- Center core hub -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="3" fill="#E30613"/>
  </g>
  <text x="50" y="88" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="9" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">KRAKATAU</text>
</svg>
