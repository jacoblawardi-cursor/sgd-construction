<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Jotun Penguin & Globe Ring Emblem -->
  <g transform="translate(50, 42)">
    <!-- Globe Circle -->
    <circle cx="0" cy="0" r="25" fill="#003865"/>
    <!-- Orbit Ring -->
    <ellipse cx="0" cy="0" rx="25" ry="12" fill="none" stroke="#D8232A" stroke-width="3.5" transform="rotate(-28)"/>
    <!-- Penguin silhouette body -->
    <path d="M -4 -17 C -1 -17, 4 -15, 4 -11 C 4 -7, 8 -3, 8 6 C 8 15, 3 19, -2 19 C -6 19, -10 15, -10 6 C -10 -3, -7 -17, -4 -17 Z" fill="#FFFFFF"/>
    <!-- Penguin Beak / Red accent -->
    <path d="M 3 -13 L 9 -11 L 3 -9 Z" fill="#D8232A"/>
    <!-- Penguin Eye -->
    <circle cx="1" cy="-12" r="1.3" fill="#003865"/>
    <!-- Penguin Wing -->
    <path d="M -7 -4 C -9 2, -8 11, -5 15 C -8 11, -9 5, -8 -2 Z" fill="#003865"/>
  </g>
  <text x="50" y="85" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#003865" text-anchor="middle" letter-spacing="1">JOTUN</text>
</svg>
