<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rucika Pipa Official Style Logo -->
  <defs>
    <linearGradient id="rucikaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="rucikaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Flowing Pipe / Water Ribbon -->
  <g transform="translate(50, 36)">
    <!-- Water Wave Ribbon Green/Cyan -->
    <path d="M -26 6 C -18 -16, 6 -16, 12 -4 C 18 6, 26 6, 28 0 C 26 12, 10 14, 2 4 C -6 -6, -16 -6, -26 6 Z" fill="url(#rucikaGreen)"/>
    <!-- Water Stream Blue -->
    <path d="M -24 -2 C -16 -12, 4 -12, 16 0 C 8 8, -4 4, -12 -2 Z" fill="url(#rucikaBlue)"/>
    <!-- Water Drop Accent -->
    <circle cx="20" cy="-6" r="3.5" fill="#0284C7"/>
  </g>
  <!-- Rucika Typography -->
  <text x="50" y="73" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="10.5" font-weight="900" fill="#0369A1" text-anchor="middle" letter-spacing="1.5">RUCIKA</text>
  <text x="50" y="85" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="800" fill="#15803D" text-anchor="middle" letter-spacing="2">PIPING SYSTEM</text>
</svg>
