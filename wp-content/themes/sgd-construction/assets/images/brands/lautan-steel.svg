<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Lautan Steel Indonesia Official Style Logo -->
  <defs>
    <linearGradient id="lsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="lsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- Background circular badge for crisp contrast -->
  <circle cx="50" cy="50" r="46" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Steel Roll / Wave Symbol -->
  <g transform="translate(50, 40)">
    <!-- Red Swoosh Arch -->
    <path d="M -26 6 C -20 -18, 10 -24, 26 -10 C 22 -6, 14 -12, 0 -8 C -14 -4, -20 2, -26 6 Z" fill="url(#lsRed)"/>
    <!-- Blue Rolling Steel Wave -->
    <path d="M -28 14 C -12 8, 8 18, 28 6 C 24 16, 4 20, -10 18 C -22 16, -26 14, -28 14 Z" fill="url(#lsGrad)"/>
    <!-- Central Steel Billet Core -->
    <polygon points="-8,4 8,-6 14,4 -2,14" fill="#0F172A"/>
  </g>
  <!-- Lautan Steel Typography -->
  <text x="50" y="74" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#0F2C59" text-anchor="middle" letter-spacing="1.2">LAUTAN</text>
  <text x="50" y="85" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="7.5" font-weight="800" fill="#DC2626" text-anchor="middle" letter-spacing="2.5">STEEL</text>
</svg>
